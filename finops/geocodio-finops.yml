meters:
- name: lookups
  description: Geocoding and reverse geocoding lookups billed at $1 per 1,000 after the daily free allowance.
  unit: lookups
  aggregation: sum
  dimensions:
  - account
  - api
- name: field_append_lookups
  description: Data append fields, each counting as one additional lookup per record.
  unit: lookups
  aggregation: sum
  dimensions:
  - account
  - field
- name: flex_credits
  description: Rolling monthly credits consumed under a Flex subscription plan.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - plan
- name: list_records
  description: Records processed through asynchronous spreadsheet list jobs.
  unit: records
  aggregation: sum
  dimensions:
  - account
  - list
principles:
- name: Visibility
  description: Pull Geocodio account usage; inspect daily lookup burn and free-allowance consumption.
- name: Allocation
  description: Tag API keys per workload/team; map metered lookups to internal cost centers.
- name: Optimization
  description: Stay within the 2,500/day free allowance where possible; request only the data append fields you need since each field doubles per-record cost; use Flex bundles or Unlimited for predictable high volume.
- name: Accountability
  description: Assign owners per project/key; review monthly lookup spend against budget and free-tier headroom.
