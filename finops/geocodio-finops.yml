description: >-
  FinOps view of Geocodio spend. Geocodio bills usage-based per-lookup rates
  at $1 per 1,000 lookups after a daily free allowance of 2,500 lookups. Each
  requested data append field counts as an additional lookup, so enrichment
  multiplies cost. Flex subscriptions bundle rolling credits at a discount and
  the Unlimited plan provides a flat-rate dedicated instance.
notes: >-
  Per-lookup and subscription rates are subject to change; verify against the
  Geocodio pricing page during reconciliation.
