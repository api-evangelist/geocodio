openapi: 3.2.0
info:
  title: Geocodio Distance API
  description: 'Geocodio''s RESTful API allows you to perform forward and reverse geocoding lookups. We support both batch requests as well as individual lookups.


    You can also optionally ask for data appends such as timezone, Congressional districts or similar things of that nature.'
  termsOfService: https://www.geocod.io/terms-of-use/
  license:
    name: Geocodio Terms of Use
    url: https://www.geocod.io/terms-of-use/
  contact:
    email: hello@geocod.io
  version: '2.0'
servers:
- url: https://api.geocod.io/v2
  description: Self-Serve Geocodio API Endpoint
- url: https://api.enterprise.geocod.io/v2
  description: Geocodio API Endpoint for Enterprise Customers
tags:
- name: Distance
  description: Calculate distances between one origin and one or more destinations
paths:
  /distance:
    get:
      tags:
      - Distance
      summary: Calculate distance from one origin to multiple destinations
      operationId: distanceSingle
      parameters:
      - name: origin
        in: query
        schema:
          type: string
        required: true
      - name: destinations[]
        in: query
        schema:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 100
        required: true
      - name: mode
        in: query
        schema:
          type: string
          enum:
          - driving
          - haversine
          - straightline
      - name: units
        in: query
        schema:
          type: string
          enum:
          - miles
          - km
      - name: max_results
        in: query
        schema:
          type: integer
          minimum: 1
      - name: max_distance
        in: query
        schema:
          type: number
          minimum: 0
      - name: max_duration
        in: query
        schema:
          type: integer
          minimum: 0
      - name: order_by
        in: query
        schema:
          type: string
          enum:
          - distance
          - duration
      - name: min_distance
        in: query
        schema:
          type: number
          minimum: 0
      - name: min_duration
        in: query
        schema:
          type: integer
          minimum: 0
      - name: sort_order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: country
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistanceResponse'
              examples:
                address-to-addresses:
                  summary: Distance from address to addresses -- full combo of geocode and distance
                  value:
                    origin:
                      location:
                      - 38.886672
                      - -77.094735
                      geocode:
                        stable_address_key: gcod_usndjrg9xn28uz888u3fkm6yusrdg
                        address_components:
                          number: '1109'
                          predirectional: N
                          street: Highland
                          suffix: St
                          formatted_street: N Highland St
                          city: Arlington
                          county: Arlington County
                          state_province: VA
                          postal_code: '22201'
                          country: US
                        address_lines:
                        - 1109 N Highland St
                        - ''
                        - Arlington, VA 22201
                        formatted_address: 1109 N Highland St, Arlington, VA 22201
                        location:
                          lat: 38.886672
                          lng: -77.094735
                        accuracy: 1
                        accuracy_type: rooftop
                        match_type: building_centroid
                        source: Arlington
                    mode: straightline
                    destinations:
                    - query: 1600 Pennsylvania Ave, Washington DC
                      location:
                      - 38.897675
                      - -77.036547
                      id: null
                      distance_miles: 3.2
                      distance_km: 5.2
                      geocode:
                        stable_address_key: gcod_usnqu2qtyk7ac38dlpzanec598p2c
                        address_components:
                          number: '1600'
                          street: Pennsylvania
