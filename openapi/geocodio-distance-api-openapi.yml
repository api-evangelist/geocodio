        meta:
          $ref: '#/components/schemas/AcsCategoryMeta'
    NestedGeocodingResult:
      type: object
      properties:
        stable_address_key:
          type: string
        address_components:
          $ref: '#/components/schemas/AddressComponents'
        address_lines:
          type: array
          items:
            type: string
        formatted_address:
