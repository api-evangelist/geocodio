                          lng: -77.036547
                        accuracy: 1
                        accuracy_type: rooftop
                        match_type: null
                        source: Statewide (City of Washington)
                    - query: 725 8th St SE, Washington DC
                      location:
                      - 38.880394
                      - -76.99533
                      id: null
                      distance_miles: 5.4
                      distance_km: 8.6
                      geocode:
                        stable_address_key: gcod_usn9uwkqf9al2kecx449lhvue4mac
