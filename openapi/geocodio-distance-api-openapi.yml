components:
  schemas:
    Economics:
      type: object
      properties:
        Number of households:
          $ref: '#/components/schemas/GenderBreakdown'
        Median household income:
          $ref: '#/components/schemas/GenderBreakdown'
        Household income:
          $ref: '#/components/schemas/HouseholdIncome'
        Per capita income:
          $ref: '#/components/schemas/GenderBreakdown'
        meta:
          $ref: '#/components/schemas/AcsCategoryMeta'
    Ffiec:
      type: object
      properties:
        collection_year:
          type: integer
        msa_md_code:
          type: string
        fips_state_code:
          type: string
        fips_county_code:
          type: string
        census_tract:
          type: string
        principal_city:
          type: boolean
        small_county:
          $ref: '#/components/schemas/SmallCounty'
        split_tract:
          $ref: '#/components/schemas/SmallCounty'
        demographic_data:
          $ref: '#/components/schemas/SmallCounty'
        urban_rural_flag:
          $ref: '#/components/schemas/SmallCounty'
        msa_md_median_family_income:
          type: integer
        msa_md_median_household_income:
          type: integer
        tract_median_family_income_percentage:
          type: number
          format: float
        ffiec_estimated_msa_md_median_family_income:
          type: integer
        income_indicator:
          type: string
        cra_poverty_criteria:
          type: boolean
        cra_unemployment_criteria:
          type: boolean
        cra_distressed_criteria:
          type: boolean
        cra_remote_rural_low_density_criteria:
          type: boolean
        previous_year_cra_distressed_criteria:
          type: boolean
        previous_year_cra_underserved_criterion:
          type: boolean
        meets_current_previous_criteria:
          type: boolean
        tract_minority_population_percentage:
          type:
          - number
          - 'null'
          format: float
    DistanceMatrixCell:
      type: object
      properties:
        query:
          type: string
        location:
          type: array
          items:
            type: number
            format: float
        id:
          type:
          - string
          - 'null'
        distance_miles:
          type: number
          format: float
        distance_km:
          type: number
          format: float
        geocode:
          $ref: '#/components/schemas/GeocodingResult'
        duration_seconds:
          type: integer
    AcsStatistic:
      type: object
      properties:
        value:
          type: number
        margin_of_error:
          type: number
        percentage:
          type: number
    HouseholdTypeByHousehold:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/AcsTableMeta'
        Total:
          $ref: '#/components/schemas/AcsStatisticSimple'
        Family households:
          $ref: '#/components/schemas/AcsStatistic'
        'Family households: Married-couple family':
          $ref: '#/components/schemas/AcsStatistic'
        'Family households: Other family':
          $ref: '#/components/schemas/AcsStatistic'
        'Family households: Other family: Male householder, no spouse present':
          $ref: '#/components/schemas/AcsStatistic'
        'Family households: Other family: Female householder, no spouse present':
          $ref: '#/components/schemas/AcsStatistic'
        Nonfamily households:
          $ref: '#/components/schemas/AcsStatistic'
        'Nonfamily households: Householder living alone':
          $ref: '#/components/schemas/AcsStatistic'
        'Nonfamily households: Householder not living alone':
          $ref: '#/components/schemas/AcsStatistic'
    Families:
      type: object
      properties:
        Household type by household:
          $ref: '#/components/schemas/HouseholdTypeByHousehold'
        Household type by population:
          $ref: '#/components/schemas/HouseholdTypeByPopulation'
        Marital status:
          $ref: '#/components/schemas/MaritalStatus'
        Family Type by Presence and Age of Own Children Under 18 Years:
          $ref: '#/components/schemas/FamilyTypeByPresenceAndAgeOfOwnChildrenUnder18Years'
        Average Household Size of Occupied Housing Units by Tenure:
          $ref: '#/components/schemas/AverageHouseholdSizeOfOccupiedHousingUnitsByTenure'
        Own Children Under 18 Years by Family Type and Age:
          $ref: '#/components/schemas/OwnChildrenUnder18YearsByFamilyTypeAndAge'
        meta:
          $ref: '#/components/schemas/AcsCategoryMeta'
    References:
