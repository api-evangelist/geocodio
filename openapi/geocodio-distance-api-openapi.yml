        travel_to_work_area:
          $ref: '#/components/schemas/UKCensusTravelToWorkArea'
        international_territorial_level:
          $ref: '#/components/schemas/UKCensusInternationalTerritorialLevel'
        rural_urban_classification:
          $ref: '#/components/schemas/UKCensusRuralUrbanClassification'
    FieldAppends:
      type: object
      properties:
        congressional_districts:
