openapi: 3.2.0
info:
  title: Geocodio Distance Jobs API
  description: 'Geocodio''s RESTful API allows you to perform forward and reverse geocoding lookups. We support both batch requests as well as individual lookups.


    You can also optionally ask for data appends such as timezone, Congressional districts or similar things of that nature.'
  termsOfService: https://www.geocod.io/terms-of-use/
  license:
    name: Geocodio Terms of Use
    url: https://www.geocod.io/terms-of-use/
  contact:
    email: hello@geocod.io
  version: '2.0'
servers:
- url: https://api.geocod.io/v2
  description: Self-Serve Geocodio API Endpoint
- url: https://api.enterprise.geocod.io/v2
  description: Geocodio API Endpoint for Enterprise Customers
tags:
- name: distance-jobs
  description: Async distance matrix and one-to-one pairs job management
paths:
  /distance-jobs:
    get:
      tags:
      - distance-jobs
      summary: List distance matrix jobs
      operationId: distanceMatrixList
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number for pagination
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistanceMatrixJobCollection'
              examples:
                basic:
                  summary: List distance matrix jobs for the current user
                  value:
                    data:
                    - identifier: 124019f86251e4159ffb4b2dbceee4470e0283dc
                      name: esse qui dolorem
