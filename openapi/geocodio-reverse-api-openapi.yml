          $ref: '#/components/schemas/StateLegislativeDistricts'
        uk_census:
          $ref: '#/components/schemas/UKCensus'
        uk_devolved:
          type: array
          items:
            $ref: '#/components/schemas/UKLegislativeDistrict'
        uk_local:
          type: array
          items:
            $ref: '#/components/schemas/UKLegislativeDistrict'
        uk_westminster:
          type: array
          items:
            $ref: '#/components/schemas/UKLegislativeDistrict'
        zip4:
          $ref: '#/components/schemas/Zip4'
