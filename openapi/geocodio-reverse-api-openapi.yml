      - name: destinations[]
        in: query
        schema:
          type: array
          items:
            type: string
        description: Array of destination locations for distance calculation
        style: form
        explode: true
      - name: distance_mode
        in: query
        schema:
          type: string
          enum:
          - driving
          - straightline
        description: Distance calculation mode
      - name: distance_units
        in: query
        schema:
          type: string
          enum:
          - miles
          - km
        description: Unit of measurement for distance values
      - name: distance_max_results
        in: query
        schema:
          type: integer
          minimum: 1
        description: Maximum number of destinations to return per result
      - name: distance_max_distance
        in: query
        schema:
          type: number
          minimum: 0
        description: Maximum distance filter (in specified units)
      - name: distance_max_duration
        in: query
        schema:
          type: integer
          minimum: 0
        description: Maximum duration filter in seconds
      - name: distance_min_distance
        in: query
        schema:
          type: number
          minimum: 0
        description: Minimum distance filter (in specified units)
      - name: distance_min_duration
        in: query
        schema:
          type: integer
          minimum: 0
        description: Minimum duration filter in seconds
      - name: distance_order_by
        in: query
        schema:
          type: string
          enum:
          - distance
          - duration
        description: Field to sort destinations by
      - name: distance_sort_order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
        description: Sort order for destinations
      - name: skipGeocoding
        in: query
        schema:
          type: string
        description: When set, skips reverse geocoding and applies field appends directly to the coordinates. Requires the fields parameter.
      - name: q
        in: query
        schema:
          type: string
        description: Coordinates to reverse geocode (latitude,longitude)
