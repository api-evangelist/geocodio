components:
  schemas:
    Economics:
      type: object
      properties:
        Number of households:
          $ref: '#/components/schemas/GenderBreakdown'
        Median household income:
          $ref: '#/components/schemas/GenderBreakdown'
        Household income:
          $ref: '#/components/schemas/HouseholdIncome'
        Per capita income:
          $ref: '#/components/schemas/GenderBreakdown'
        meta:
          $ref: '#/components/schemas/AcsCategoryMeta'
    Ffiec:
      type: object
      properties:
        collection_year:
          type: integer
        msa_md_code:
          type: string
        fips_state_code:
          type: string
        fips_county_code:
          type: string
        census_tract:
          type: string
        principal_city:
          type: boolean
        small_county:
          $ref: '#/components/schemas/SmallCounty'
        split_tract:
          $ref: '#/components/schemas/SmallCounty'
        demographic_data:
          $ref: '#/components/schemas/SmallCounty'
        urban_rural_flag:
          $ref: '#/components/schemas/SmallCounty'
        msa_md_median_family_income:
          type: integer
        msa_md_median_household_income:
          type: integer
        tract_median_family_income_percentage:
          type: number
          format: float
        ffiec_estimated_msa_md_median_family_income:
          type: integer
        income_indicator:
          type: string
        cra_poverty_criteria:
          type: boolean
        cra_unemployment_criteria:
          type: boolean
        cra_distressed_criteria:
          type: boolean
        cra_remote_rural_low_density_criteria:
          type: boolean
        previous_year_cra_distressed_criteria:
          type: boolean
        previous_year_cra_underserved_criterion:
          type: boolean
        meets_current_previous_criteria:
          type: boolean
        tract_minority_population_percentage:
          type:
          - number
          - 'null'
          format: float
    ReverseGeocodingResult:
      type: object
      properties:
        stable_address_key:
          type: string
        address_components:
          $ref: '#/components/schemas/AddressComponents'
        address_lines:
          type: array
          items:
            type: string
        formatted_address:
          type: string
        location:
          $ref: '#/components/schemas/Location'
        accuracy:
          type: number
          format: float
        accuracy_type:
          type: string
        match_type:
          type:
          - string
          - 'null'
        source:
          type: string
        fields:
          $ref: '#/components/schemas/FieldAppends'
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/DistanceDestination'
    AcsStatistic:
      type: object
      properties:
        value:
          type: number
        margin_of_error:
          type: number
        percentage:
          type: number
    HouseholdTypeByHousehold:
